<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond sombre plein (compatible maskable) -->
  <rect width="512" height="512" fill="#0a1628"/>
  <!-- Halo orange subtil -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  <!-- Texte "A+" centré -->
  <text
    x="256"
    y="310"
    font-family="Arial Black, Segoe UI, Helvetica Neue, sans-serif"
    font-weight="900"
    font-size="230"
    fill="#FF8C00"
    text-anchor="middle"
    letter-spacing="-10"
  >A+</text>
</svg>
